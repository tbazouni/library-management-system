$kind: http-request
description: "Run after creating book and borrower. Saves borrowingId. Expected: 201, status BORROWED, returnDate null; book availability becomes false."
url: "{{baseUrl}}/api/borrowings/books/{{bookId}}"
method: POST
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "borrowerId": {{borrowerId}}
    }
scripts:
