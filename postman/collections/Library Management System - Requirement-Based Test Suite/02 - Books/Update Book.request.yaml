$kind: http-request
description: Update all book fields supported by the request DTO. Availability is managed by borrowing operations, not the DTO.
url: "{{baseUrl}}/api/books/{{bookId}}"
method: PUT
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "title": "Frankenstein - Updated",
      "isbn": "9780486282114",
      "category": "HISTORY",
      "authorId": {{authorId}}
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test("HTTP status is 200", function () { pm.response.to.have.status(200); });
      pm.test("HTTP status is 200", function () { pm.response.to.have.status(200); });
      pm.test("HTTP status is 200", function () { pm.response.to.have.status(200); });
      pm.test("HTTP status is 200", function () { pm.response.to.have.status(200); });
      pm.test("HTTP status is 200", function () { pm.response.to.have.status(200); });
    language: text/javascript
order: 7000
