$kind: http-request
description: Creates a book with no borrowing transactions. Saves cleanupBookId.
url: "{{baseUrl}}/api/books"
method: POST
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "title": "Postman Cleanup Book",
      "isbn": "9780000000091",
      "category": "FICTION",
      "authorId": {{cleanupAuthorId}}
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test("HTTP status is one of [200, 201]", function () { pm.expect(pm.response.code).to.be.oneOf([200, 201]); });
      if (pm.response.code === 200 || pm.response.code === 201) { const d = pm.response.json(); if (d.id !== undefined) pm.collectionVariables.set("cleanupBookId", d.id); }
    language: text/javascript
order: 2000
