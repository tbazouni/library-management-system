# Application
spring.application.name=library-management-system

# PostgreSQL connection
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/library_management_system}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}

# JPA and Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Server
server.port=8080

# Borrowing transaction limit
borrower.transaction.limit=5

# Email notification micro-service (MS2)
email.service.url=${EMAIL_SERVICE_URL:http://localhost:8081}
