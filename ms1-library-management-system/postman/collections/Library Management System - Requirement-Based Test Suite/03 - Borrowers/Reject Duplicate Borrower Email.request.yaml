$kind: http-request
description: Email uniqueness test.
url: "{{baseUrl}}/api/borrowers"
method: POST
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "name": "Duplicate Email User",
      "email": "alex.morgan.library@example.com",
      "phoneNumber": "123456"
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test("Duplicate email is rejected", function () { pm.expect(pm.response.code).to.be.oneOf([400, 409, 500]); });
      pm.test("Duplicate email is rejected", function () { pm.expect(pm.response.code).to.be.oneOf([400, 409]); });
      pm.test("Duplicate email is rejected", function () { pm.expect(pm.response.code).to.be.oneOf([400, 409, 500]); });
      pm.test("Duplicate email is rejected", function () { pm.expect(pm.response.code).to.be.oneOf([400, 409, 500]); });
      pm.test("Duplicate email is rejected", function () { pm.expect(pm.response.code).to.be.oneOf([400, 409, 500]); });
    language: text/javascript
order: 6000
