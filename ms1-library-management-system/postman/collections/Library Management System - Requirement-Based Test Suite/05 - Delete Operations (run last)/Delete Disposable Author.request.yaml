$kind: http-request
description: "Expected: 204 No Content. Its disposable book has already been deleted."
url: "{{baseUrl}}/api/authors/{{cleanupAuthorId}}"
method: DELETE
headers:
  Content-Type: application/json
scripts:
  - type: afterResponse
    code: pm.test("HTTP status is 204", function () { pm.response.to.have.status(204); });
    language: text/javascript
order: 5000
