$kind: http-request
description: "Optional diagnostic: expected 409 because the returned borrowing transaction still references this book. The challenge does not require deleting borrowing transactions."
url: "{{baseUrl}}/api/books/{{bookId}}"
method: DELETE
headers:
  Content-Type: application/json
scripts:
  - type: afterResponse
    code: pm.test("HTTP status is 409", function () { pm.response.to.have.status(409); });
    language: text/javascript
order: 7000
