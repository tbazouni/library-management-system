$kind: http-request
description: Creates an author used only by the delete tests. Saves cleanupAuthorId.
url: "{{baseUrl}}/api/authors"
method: POST
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "name": "Postman Cleanup Author",
      "biography": "Created only to verify delete endpoints."
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test("HTTP status is one of [200, 201]", function () { pm.expect(pm.response.code).to.be.oneOf([200, 201]); });
      if (pm.response.code === 200 || pm.response.code === 201) { const d = pm.response.json(); if (d.id !== undefined) pm.collectionVariables.set("cleanupAuthorId", d.id); }
    language: text/javascript
order: 1000
