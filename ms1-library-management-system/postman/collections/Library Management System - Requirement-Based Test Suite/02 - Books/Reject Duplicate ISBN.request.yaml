      pm.test("Duplicate ISBN is rejected", function () { pm.expect(pm.response.code).to.be.oneOf([400, 409, 500]); });
      pm.test("Duplicate ISBN is rejected", function () { pm.expect(pm.response.code).to.be.oneOf([400, 409, 500]); });
      pm.test("Duplicate ISBN is rejected", function () { pm.expect(pm.response.code).to.be.oneOf([400, 409, 500]); });
    language: text/javascript
order: 9000
