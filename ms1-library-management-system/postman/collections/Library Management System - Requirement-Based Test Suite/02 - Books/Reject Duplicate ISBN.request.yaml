$kind: http-request
description: "Business/data-integrity test. Expected: conflict or client error; current RuntimeException may become 500."
url: "{{baseUrl}}/api/books"
method: POST
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "title": "Duplicate ISBN test",
      "isbn": "9780486282114",
      "category": "FICTION",
      "authorId": {{authorId}}
    }
