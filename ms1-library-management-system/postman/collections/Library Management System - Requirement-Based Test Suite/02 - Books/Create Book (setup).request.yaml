$kind: http-request
description: Run after Create Author. Saves bookId.
url: "{{baseUrl}}/api/books"
method: POST
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "title": "Frankenstein",
      "isbn": "9780486282114",
      "category": "FICTION",
      "authorId": {{authorId}}
    }
