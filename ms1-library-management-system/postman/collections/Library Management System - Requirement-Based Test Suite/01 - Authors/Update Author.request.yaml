$kind: http-request
description: Full update of the author.
url: "{{baseUrl}}/api/authors/{{authorId}}"
method: PUT
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "name": "Mary Wollstonecraft Shelley",
      "biography": "Updated biography."
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test("HTTP status is 200", function () { pm.response.to.have.status(200); });
      pm.test("HTTP status is 200", function () { pm.response.to.have.status(200); });
      pm.test("HTTP status is 200", function () { pm.response.to.have.status(200); });
      pm.test("HTTP status is 200", function () { pm.response.to.have.status(200); });
      pm.test("HTTP status is 200", function () { pm.response.to.have.status(200); });
    language: text/javascript
order: 4000
