plugins {
    id 'base'
}

description = 'Library Management System microservices (MS1 and MS2)'

tasks.named('build') {
    dependsOn subprojects.collect { "${it.path}:build" }
}

tasks.register('test') {
    group = 'verification'
    description = 'Runs tests for MS1 and MS2.'
    dependsOn subprojects.collect { "${it.path}:test" }
}

tasks.named('clean') {
    dependsOn subprojects.collect { "${it.path}:clean" }
}
